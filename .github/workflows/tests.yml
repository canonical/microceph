name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # Nightly full run on main for flaky rate data

jobs:
  build-microceph:
    name: Build microceph snap
    runs-on: ubuntu-24.04
    env:
      SNAPCRAFT_BUILD_ENVIRONMENT: "lxd"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy utils
        run: cp tests/scripts/actionutils.sh $HOME

      - name: Clear FORWARD firewall rules
        run: ~/actionutils.sh cleaript

      - name: Install dependencies
        run: |
          ~/actionutils.sh setup_lxd

          sudo snap install snapcraft --classic
          snap list

      - name: Cache snap artifact
        id: snap-cache
        uses: actions/cache@v4
        with:
          path: "*.snap"
          key: snap-${{ hashFiles('snap/**', 'microceph/**', 'microceph-orch/**', 'snapcraft/**', 'patches/**') }}

      - name: Build snaps
        if: steps.snap-cache.outputs.cache-hit != 'true'
        run: snapcraft

      - name: Upload snap artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snaps
          path: "*.snap"
          retention-days: 5

  # Infra gate for the whole matrix: on a gross Snap Store or
  # Ubuntu archive outage, fail this one job and skip every suite instead
  # of recording one failure per suite. It cannot see inside the LXD
  # instances the suites create later; in-instance checks are tracked in
  # https://github.com/canonical/microceph/issues/836
  preflight:
    name: Preflight infra gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe Snap Store and Ubuntu archive reachability
        run: |
          failures=""
          check() {
              local name="$1" url="$2"
              shift 2
              # Keep curl's exponential backoff (1s, 2s) and honor Retry-After.
              if curl -sSf --max-time 10 --retry 2 --retry-connrefused \
                  --retry-max-time 30 "$@" "$url" >/dev/null 2>&1; then
                  echo "$name reachable: $url"
              else
                  failures="${failures:+$failures, }$name ($url)"
              fi
          }

          # api.snapcraft.io answers 400 to info queries without the
          # device-series header, so the probe would never pass without it.
          check snap-store "https://api.snapcraft.io/v2/snaps/info/lxd" -H "Snap-Device-Series: 16"
          check ubuntu-archive "http://archive.ubuntu.com/ubuntu/dists/"
          check ceph-ppa "https://ppa.launchpadcontent.net/lmlogiudice/ceph-stonking-tentacle/ubuntu/dists/"

          if [ -n "$failures" ]; then
              message="kind=preflight PREFLIGHT: endpoint checks failed: $failures"
              echo "::error title=Infra::${message}"
              echo "${message}" >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi

      - name: Download Snap Store canary
        run: |
          work_dir=$(mktemp -d)
          trap 'rm -rf "$work_dir"' EXIT
          cd "$work_dir"

          # Download and verify a small snap and its assertions; install nothing.
          if timeout --kill-after=5s 60s snap download hello-world --channel=latest/stable; then
              echo "Snap Store payload and assertions verified"
          else
              status=$?
              message="kind=preflight PREFLIGHT: Snap Store payload/assertion download failed (exit $status)"
              echo "::error title=Infra::${message}"
              echo "${message}" >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi

      - name: Download APT test tools
        run: |
          work_dir=$(mktemp -d)
          trap 'rm -rf "$work_dir"' EXIT
          mkdir -p "$work_dir/lists/partial" "$work_dir/cache/archives/partial" \
              "$work_dir/log" "$work_dir/downloads"

          # Keep the runner's Ubuntu mirrors and keys, not unrelated third-party sources.
          sources=/etc/apt/sources.list
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sources=/etc/apt/sources.list.d/ubuntu.sources
          fi

          # Fresh indexes and downloads prevent cache hits from hiding an outage.
          # Ignore installed versions when selecting packages from those indexes.
          # Disable host update hooks so this check only writes in its temporary directory.
          cat > "$work_dir/apt.conf" <<EOF
          #clear APT::Update::Pre-Invoke; // Disable host hooks that run before index updates.
          #clear APT::Update::Post-Invoke; // Disable host hooks that run after index updates.
          #clear APT::Update::Post-Invoke-Success; // Disable host hooks that run after successful updates.
          Dir::Etc::sourcelist "$sources"; // Use the runner's Ubuntu repository definitions.
          Dir::Etc::sourceparts "-"; // Do not load additional repositories from sources.list.d.
          Dir::State::lists "$work_dir/lists"; // Fetch indexes into a fresh temporary directory.
          Dir::State::status "/dev/null"; // Ignore installed versions when selecting download candidates.
          Dir::Cache "$work_dir/cache"; // Keep APT cache files separate from the host cache.
          Dir::Log "$work_dir/log"; // Keep any APT logs in the temporary directory.
          Acquire::Languages "none"; // Skip package-description translation indexes.
          Acquire::Retries "2"; // Retry failed file downloads up to twice.
          Acquire::http::Timeout "10"; // Limit HTTP connection and data inactivity waits to 10 seconds.
          Acquire::https::Timeout "10"; // Limit HTTPS connection and data inactivity waits to 10 seconds.
          Acquire::IndexTargets::deb::DEP-11::DefaultEnabled "false"; // Skip AppStream application metadata.
          Acquire::IndexTargets::deb::CNF::DefaultEnabled "false"; // Skip command-not-found lookup indexes.
          EOF

          check_apt() {
              local status message
              if timeout --kill-after=5s 90s apt-get -c "$work_dir/apt.conf" "$@"; then
                  return 0
              else
                  status=$?
                  message="kind=preflight PREFLIGHT: APT $1 failed (exit $status)"
                  echo "::error title=Infra::${message}"
                  echo "${message}" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
              fi
          }

          cd "$work_dir/downloads"
          check_apt update --error-on=any
          check_apt download jq s3cmd

  robot-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner || 'ubuntu-22.04' }}
    needs: [preflight, build-microceph]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: dsl-baseline-tests
            name: DSL baseline tests
            suite: dsl-functional-tests
            args: --variable XTRACE:True --test "Run DSL Baseline Tests"

          - id: dsl-waldb-validation-tests
            name: DSL WAL-DB validation tests
            suite: dsl-functional-tests
            args: --variable XTRACE:True --test "Run DSL WAL-DB Validation Tests"

          - id: dsl-waldb-dryrun-tests
            name: DSL WAL-DB dry-run tests
            suite: dsl-functional-tests
            args: --variable XTRACE:True --test "Run DSL WAL-DB Dry-Run Tests"

          - id: dsl-waldb-provision-tests
            name: DSL WAL-DB provision tests
            suite: dsl-functional-tests
            args: --variable XTRACE:True --test "Run DSL WAL-DB Provision Tests"

          - id: dsl-waldb-cleanup-tests
            name: DSL WAL-DB cleanup tests
            suite: dsl-functional-tests
            args: --variable XTRACE:True --test "Run DSL WAL-DB Cleanup Tests"

          - id: dsl-waldb-consistency-tests
            name: DSL WAL-DB consistency tests
            suite: dsl-functional-tests
            args: --variable XTRACE:True --test "Run DSL WAL-DB Consistency Tests"

          - id: api-tests
            name: API tests
            suite: api-tests
            args: --variable XTRACE:True

          - id: single-system-tests
            name: Single node with encryption
            suite: single-system-tests

          - id: multi-node-tests
            name: Multi node testing
            suite: multi-node-tests

          - id: availability-zone-tests
            name: Availability zone crush rule testing
            suite: availability-zone-tests

          - id: multi-node-tests-with-custom-microceph-ip
            name: Multi node testing with custom microceph IP
            suite: multi-node-tests-with-custom-microceph-ip

          - id: test-sequential-mon-host-refresh
            name: Regression test for sequential join mon host refresh (issue #556)
            suite: test-sequential-mon-host-refresh

          - id: test-maintenance-modes
            name: Test maintenance mode
            suite: test-maintenance-modes

          - id: loop-file-tests
            name: Test with loopback file OSDs
            suite: loop-file-tests

          - id: wal-db-tests
            name: Test WAL/DB device usage
            suite: wal-db-tests

          - id: upgrade-squid-tests
            name: Test squid upgrades
            suite: upgrade-squid-tests

          - id: cluster-tests
            name: Test MicroCeph Cluster features.
            suite: cluster-tests

          - id: rbd-replication-test
            name: Test MicroCeph RBD Remote Replication features.
            suite: rbd-replication-test

          - id: cephfs-replication-test
            name: Test MicroCeph Cephfs Remote Replication features.
            suite: cephfs-replication-test
            runner: ubuntu-24.04

          - id: nfs-test
            name: Test MicroCeph NFS feature
            suite: nfs-test

          - id: nfs-multinode-test
            name: Test MicroCeph NFS feature (multinode)
            suite: nfs-multinode-test

          - id: messenger-v2-tests
            name: Messenger v2 tests
            suite: messenger-v2-tests

          - id: multi-subnet-tests
            name: Multi subnet bootstrap testing
            suite: multi-subnet-tests

          - id: wiping-test
            name: Verify pristineness and wiping
            suite: wiping-test
            args: --variable XTRACE:True

          - id: cephadm-adopt-test
            name: Adopt test with cephadm
            suite: cephadm-adopt-test
            runner: ubuntu-24.04
            args: --variable XTRACE:True

          - id: deferred-ceph-single-tests
            name: Deferred-Ceph bootstrap single node
            suite: deferred-ceph-single-tests

          - id: deferred-ceph-multinode-tests
            name: Deferred-Ceph lifecycle and placement multi node
            suite: deferred-ceph-multinode-tests
            runner: self-hosted-linux-amd64-jammy-xlarge

          - id: legacy-placement-tests
            name: Legacy bootstrap placement regression
            suite: legacy-placement-tests
    steps:
      - name: Download snap
        uses: actions/download-artifact@v4
        with:
          name: snaps
          path: ${{ runner.temp }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear FORWARD firewall rules
        run: |
          sudo iptables -P FORWARD ACCEPT || true
          sudo ip6tables -P FORWARD ACCEPT || true
          sudo iptables -F FORWARD || true
          sudo ip6tables -F FORWARD || true

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup
          imgs=$(sudo docker images -q 2>/dev/null || true)
          [ -n "$imgs" ] && sudo docker rmi $imgs || true

      - name: Initialize LXD
        run: |
          sudo snap list lxd 2>/dev/null || sudo snap install lxd --channel=latest/stable
          sudo snap set lxd daemon.group=adm
          sudo lxd init --auto

      - name: Install tox
        run: |
          if ! command -v pipx >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y pipx
          fi
          pipx install tox
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Robot suite
        run: tox -e robot -- --test-suite ${{ matrix.suite }} --snap-path '${{ runner.temp }}/*.snap' ${{ matrix.args }}

      - name: Upload Robot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-logs-${{ matrix.id }}
          path: |
            output.xml
            log.html
            report.html
          retention-days: 5
