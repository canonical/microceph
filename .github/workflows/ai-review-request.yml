name: AI review approval request

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    name: Request maintainer approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted approval gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/ai-review.cjs
          sparse-checkout-cone-mode: false

      - name: Request approval for the current revision
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { requestReview } = require('./.github/scripts/ai-review.cjs');
            await requestReview({ github, context, core });
