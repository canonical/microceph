name: Checks

on:
  - push
  - pull_request

jobs:
  preflight:
    uses: ./.github/workflows/dqlite-preflight.yml

  static-checks:
    name: Run static checks
    runs-on: ubuntu-24.04
    needs: preflight
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-dqlite

      - name: Install Go (1.27)
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          # go.sum lives in microceph/, not at the repository root where
          # setup-go looks by default, so the module cache was never restored.
          cache-dependency-path: microceph/go.sum

      - name: Download Go modules
        working-directory: microceph
        run: |
          # GOPROXY only falls back to direct on 404/410, so a transient
          # proxy.golang.org stream error would otherwise fail the job.
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::go mod download attempt ${attempt} failed, retrying in 15s"
              sleep 15
            fi
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Install tox
        run: pipx install tox

      - name: Run static checks
        run: tox -e robot -- --test-suite static-checks

      - name: Upload Robot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-logs-static-checks
          path: |
            output.xml
            log.html
            report.html
          retention-days: 5

  unit-tests:
    name: Run Unit tests
    runs-on: ubuntu-24.04
    needs: preflight
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-dqlite

      - name: Install Go (1.27)
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          # go.sum lives in microceph/, not at the repository root where
          # setup-go looks by default, so the module cache was never restored.
          cache-dependency-path: microceph/go.sum

      - name: Download Go modules
        working-directory: microceph
        run: |
          # GOPROXY only falls back to direct on 404/410, so a transient
          # proxy.golang.org stream error would otherwise fail the job.
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::go mod download attempt ${attempt} failed, retrying in 15s"
              sleep 15
            fi
          done
          echo "::error::go mod download failed after 3 attempts"
          exit 1

      - name: Install tox
        run: pipx install tox

      - name: Run unit tests
        run: tox -e robot -- --test-suite unit-tests

      - name: Upload Robot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-logs-unit-tests
          path: |
            output.xml
            log.html
            report.html
          retention-days: 5
