name: Checks

on:
  - push
  - pull_request

jobs:
  # Review automation tests do not need Ceph/LXD, a model API key, or write access.
  ai-review-tests:
    name: Test AI review automation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Exercise authorization, approval-comment deduplication/updates, and
      # cancellation boundaries with an in-memory GitHub API; no external calls.
      - name: Run AI review Node unit tests
        run: node --test .github/scripts/ai-review.test.cjs

  preflight:
    uses: ./.github/workflows/dqlite-preflight.yml

  static-checks:
    name: Run static checks
    runs-on: ubuntu-24.04
    needs: preflight
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo add-apt-repository ppa:dqlite/dev -y --no-update
          sudo apt-get update
          sudo apt-get install -y libdqlite1.18-dev

      - name: Install Go (1.27)
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x

      - name: Install tox
        run: pipx install tox

      - name: Run static checks
        run: tox -e robot -- --test-suite static-checks

      - name: Upload Robot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-logs-static-checks
          path: |
            output.xml
            log.html
            report.html
          retention-days: 5

  unit-tests:
    name: Run Unit tests
    runs-on: ubuntu-24.04
    needs: preflight
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo add-apt-repository ppa:dqlite/dev -y --no-update
          sudo apt-get update
          sudo apt-get install -y libdqlite1.18-dev

      - name: Install Go (1.27)
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x

      - name: Install tox
        run: pipx install tox

      - name: Run unit tests
        run: tox -e robot -- --test-suite unit-tests

      - name: Upload Robot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-logs-unit-tests
          path: |
            output.xml
            log.html
            report.html
          retention-days: 5
