version: "2"

linters:
  default: standard
  settings:
    staticcheck:
      # Preserve the checks enabled by golangci-lint v1. Style and
      # quick-fix checks were not part of its default staticcheck set.
      checks:
        - all
        - -ST*
        - -QF*
        - -SA9010
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
