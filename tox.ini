[tox]
minversion = 1.6
envlist = docs
skipsdist = True

[testenv]
skip_install = True
basepython = python3
usedevelop = True
deps = -r{toxinidir}/docs/requirements.txt

[testenv:venv]
commands = {posargs}

[testenv:spelling]
commands = sphinx-build -j auto -b spelling docs _build

[testenv:docs]
commands = sphinx-build -j auto docs _build

[testenv:serve]
commands = sphinx-autobuild docs _build

[testenv:robot]
changedir = {toxinidir}
deps =
    -r{toxinidir}/tests/robot/requirements.txt
commands_pre =
    python -m pip install --require-hashes --no-deps -r {toxinidir}/snapcraft/smb/requirements.txt
setenv =
    MICROCEPH_SMB_TEST_PYTHON = {envpython}
    PYTHONPATH = {envsitepackagesdir}
pass_env =
    GITHUB_STEP_SUMMARY
    MICROCEPH_TEST_SNAPD_CHANNEL
commands = python {toxinidir}/tests/robot/robot.py {posargs}